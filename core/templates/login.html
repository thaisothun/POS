{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel=stylesheet href="{% static 'css/login.css' %}" fetchpriority=high>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.min.css" integrity="sha256-YKKnn5oXErZthQwr01oz4mEVF11gcVMJYcmUuhoyUgM=" crossorigin="anonymous">
    <title>POS - Login</title>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.24/dist/sweetalert2.all.min.js" integrity="sha256-dQbI9NheRwerRvmFjwxuZeMxa50vEi3PSFudvznVp6w=" crossorigin="anonymous"></script>
    <div class="login_container">
        <div class="logo">   
            <h1>Point of Sale System</h1>
            <h2>Welcome Back</h2>
            <p>Version 1.0</p>
        </div>
        <div class="login"> 
            <div class="login_content">
                <h1>Login</h1>
                    <form Method="POST">
                    {% csrf_token %}   
                    <div>
                    <div class="svg"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/></svg></div>{{form.username}}
                    </div>
                    <div>
                    <div class="svg"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm0-80h480v-400H240v400Zm296.5-143.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80ZM240-160v-400 400Z"/></svg></div>{{form.password}}
                    </div>
                    <div><button action="submit">Login</button></div>
                    </form>
            </div>
            {% if message %}
            <script>
                Swal.fire({
                    title: "Login Fail",
                    text: "{{message}}",
                    icon: "error"
                    });
            </script>
            {% endif %}
        </div>
        <div class="login_background">
        <video autoplay muted loop playsinline width="100%" height="100%">
            <source src="{% static 'video/login_background.mp4' %}" type="video/mp4">    
        </video>
        </div>
    </div>
    
</body>
</html>
